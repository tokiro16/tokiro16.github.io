<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title">
  <title id="title">暖桃色底上的巨大汉字与排版线条</title>
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".11"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="#e7c7b4"/>
  <rect x="42" y="42" width="1116" height="816" fill="none" stroke="#1a1916" stroke-opacity=".2"/>
  <g stroke="#1a1916" stroke-opacity=".45" stroke-width="1">
    <path d="M80 200h1040M80 760h1040"/>
    <path d="M1020 80v740M980 80v740"/>
  </g>
  <text x="60" y="610" fill="#1a1916" font-family="'Songti SC', 'SimSun', Georgia, serif" font-size="460" letter-spacing="-40">瓜</text>
  <text x="610" y="250" fill="none" stroke="#1a1916" stroke-width="1.3" font-family="Georgia, 'Times New Roman', serif" font-size="112" letter-spacing="4" opacity=".8">GOSSIP</text>
  <text x="614" y="330" fill="none" stroke="#1a1916" stroke-width="1.1" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-style="italic" letter-spacing="2" opacity=".6">lightly.</text>
  <text x="80" y="120" fill="#1a1916" font-family="Arial, sans-serif" font-size="17" letter-spacing="7" opacity=".7">03 / GOSSIP</text>
  <text x="1118" y="805" fill="#1a1916" font-family="Arial, sans-serif" font-size="14" letter-spacing="4" text-anchor="end" opacity=".6">LISTEN — DOUBT — REPEAT</text>
  <rect width="1200" height="900" filter="url(#grain)" opacity=".42"/>
</svg>
