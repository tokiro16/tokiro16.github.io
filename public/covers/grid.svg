    </filter>
  </defs>
  <rect width="1200" height="900" fill="#18221d"/>
  <g stroke="#9aa78c" stroke-opacity=".18" stroke-width="1">
    <path d="M60 0v900M160 0v900M260 0v900M360 0v900M460 0v900M560 0v900M660 0v900M760 0v900M860 0v900M960 0v900M1060 0v900M1160 0v900"/>
    <path d="M0 60h1200M0 160h1200M0 260h1200M0 360h1200M0 460h1200M0 560h1200M0 660h1200M0 760h1200M0 860h1200"/>
  </g>
  <rect x="710" y="180" width="340" height="340" fill="#d9542b"/>
  <circle cx="880" cy="350" r="118" fill="none" stroke="#f0e9dc" stroke-width="1.3"/>
