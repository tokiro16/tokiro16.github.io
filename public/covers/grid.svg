  <text x="72" y="660" fill="#f0e9dc" font-family="Georgia, 'Times New Roman', serif" font-size="176" letter-spacing="-7">PLAY</text>
  <text x="78" y="760" fill="#f0e9dc" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-style="italic" letter-spacing="-2" opacity=".78">seriously.</text>
  <text x="1116" y="805" fill="#aab08a" font-family="Arial, sans-serif" font-size="15" letter-spacing="4" text-anchor="end">SAVE / RELOAD / REPEAT</text>
  <rect width="1200" height="900" filter="url(#grain)" opacity=".5"/>
