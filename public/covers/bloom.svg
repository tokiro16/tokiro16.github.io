<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title">
  <title id="title">米色背景上的红色花朵与手写线条</title>
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".11"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="#efe7da"/>
  <rect x="42" y="42" width="1116" height="816" fill="none" stroke="#1a1916" stroke-opacity=".16"/>
  <g transform="translate(795 380)">
    <g fill="#d9542b">
      <ellipse cx="0" cy="-190" rx="90" ry="185"/>
      <ellipse cx="0" cy="190" rx="90" ry="185"/>
      <ellipse cx="-190" cy="0" rx="185" ry="90"/>
      <ellipse cx="190" cy="0" rx="185" ry="90"/>
      <ellipse cx="135" cy="-135" rx="84" ry="170" transform="rotate(45)"/>
      <ellipse cx="-135" cy="135" rx="84" ry="170" transform="rotate(45)"/>
      <ellipse cx="135" cy="135" rx="84" ry="170" transform="rotate(-45)"/>
      <ellipse cx="-135" cy="-135" rx="84" ry="170" transform="rotate(-45)"/>
    </g>
    <circle cx="0" cy="0" r="92" fill="#1a1916"/>
    <circle cx="0" cy="0" r="48" fill="#efe7da"/>
  </g>
  <path d="M795 520c-12 120 8 200-38 300" fill="none" stroke="#1a1916" stroke-width="5"/>
  <path d="M770 650c-70-45-115-15-138 30 62 38 112 22 138-30Z" fill="#6f7551"/>
  <text x="78" y="118" fill="#1a1916" font-family="Arial, sans-serif" font-size="17" letter-spacing="8" opacity=".62">07 / STYLE</text>
  <text x="74" y="705" fill="#1a1916" font-family="Georgia, 'Times New Roman', serif" font-size="142" letter-spacing="-6">What to</text>
  <text x="78" y="806" fill="#1a1916" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-style="italic" letter-spacing="-3" opacity=".72">wear?</text>
  <text x="1118" y="838" fill="#1a1916" font-family="Arial, sans-serif" font-size="14" letter-spacing="4" text-anchor="end" opacity=".52">COLOR / TEXTURE / SELF</text>
  <rect width="1200" height="900" filter="url(#grain)" opacity=".4"/>
</svg>
