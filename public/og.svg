<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title">
  <title id="title">时六 SHILIU — 在游戏与公式之间，随手记点</title>
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".1"/></feComponentTransfer>
    </filter>
    <radialGradient id="warm" cx="80%" cy="15%" r="75%">
      <stop offset="0" stop-color="#e8c4ad"/>
      <stop offset=".55" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#ece4d7"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#warm)"/>
  <rect x="34" y="34" width="1132" height="562" fill="none" stroke="#1a1916" stroke-opacity=".18"/>
  <circle cx="1030" cy="165" r="145" fill="#d9542b"/>
  <g fill="none" stroke="#1a1916" stroke-width="1" opacity=".45">
    <ellipse cx="1030" cy="165" rx="235" ry="92" transform="rotate(-22 1030 165)"/>
    <ellipse cx="1030" cy="165" rx="235" ry="92" transform="rotate(24 1030 165)"/>
  </g>
  <text x="78" y="110" fill="#1a1916" font-family="Arial, sans-serif" font-size="16" letter-spacing="8" opacity=".64">SHILIU / A PERSONAL BLOG</text>
  <text x="72" y="380" fill="#1a1916" font-family="'Songti SC', 'SimSun', Georgia, serif" font-size="190" letter-spacing="12">时六</text>
  <text x="80" y="450" fill="#1a1916" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" letter-spacing="1" opacity=".82">play. think. repeat.</text>
  <path d="M80 492h320" stroke="#d9542b" stroke-width="2"/>
  <text x="80" y="538" fill="#1a1916" font-family="Arial, sans-serif" font-size="15" letter-spacing="3" opacity=".58">玩乐 · 游戏 · 物理 · 八卦 · 计算机 · 美妆穿搭</text>
  <text x="1116" y="552" fill="#1a1916" font-family="Georgia, serif" font-size="14" letter-spacing="4" text-anchor="end" opacity=".56">EST. 2026</text>
  <rect width="1200" height="630" filter="url(#grain)" opacity=".38"/>
</svg>
